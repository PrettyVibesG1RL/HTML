<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SipZone – Virtual Drinks</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14182b;--mut:#6b7190;--ac:#4f6bff;--bd:#e1e5f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#181b30;--tx:#eef0ff;--mut:#9aa0c4;--ac:#7b90ff;--bd:#2a2e4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--card:#181b30;--tx:#eef0ff;--mut:#9aa0c4;--ac:#7b90ff;--bd:#2a2e4d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;-webkit-user-select:none;user-select:none}
h1{font-size:1.5rem;margin:14px 0 2px}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:6px}
#name{font-size:1.15rem;font-weight:600;min-height:1.6em}
#stage{touch-action:none;cursor:pointer;display:block;margin:0 auto;max-width:100%}
#hint{color:var(--mut);font-size:.85rem;min-height:1.3em}
.row{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px;flex-wrap:wrap}
button,input{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer}
#q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;width:min(320px,90%)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-width:760px;margin:6px auto 30px;padding:0 12px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 6px;cursor:pointer;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.chip i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd)}
.chip.on{border-color:var(--ac);outline:2px solid var(--ac)}
#ov{display:none;position:fixed;inset:0;z-index:50;background:#0b0d1c;touch-action:none}
#tc{position:absolute;inset:0;width:100%;height:100%}
#otop{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px}
#oname,#omsg,#pct{background:rgba(0,0,0,.4);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600;font-size:.95rem}
#omsg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));text-align:center;max-width:90%}
#obot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:8px;justify-content:center;align-items:center}
</style>
</head>
<body>
<h1>🥤 SipZone</h1>
<div class="sub">59 drinks · 0% alcohol · just vibes</div>
<div id="name"></div>
<canvas id="stage" width="320" height="400"></canvas>
<div id="hint">Hold the glass (or press Space) to drink</div>
<div class="row"><button class="btn" id="refill">Refill</button><button class="btn" id="tiltbtn">📱 Tilt mode</button><span id="stats"></span></div>
<div class="row"><input id="q" placeholder="Search 59 drinks…"></div>
<div id="grid"></div>
<div id="ov"><canvas id="tc"></canvas>
<div id="otop"><button class="btn" id="oprev">◀</button><span id="oname"></span><button class="btn" id="onext">▶</button><button class="btn" id="oclose">✕</button></div>
<div id="omsg"></div>
<div id="obot"><button class="btn" id="orefill">Refill</button><span id="pct">100%</span><button class="btn" id="oflip">⇄ Flip</button></div></div>
<script>
const D=`Water|💧|#a9dcff|0
Sparkling Water|🫧|#c8ecff|1
Cola|🥤|#3a1d0e|1
Diet Cola|🥤|#2b1a10|1
Cherry Cola|🍒|#4a1218|1
Root Beer|🥤|#3b2012|1
Ginger Ale|🫚|#e8c767|1
Lemon-Lime Soda|🍋|#e3f59a|1
Orange Soda|🍊|#ff8a1f|1
Grape Soda|🍇|#7a2fb0|1
Cream Soda|🍦|#e8c98a|1
Orange Juice|🍊|#ffa726|0
Apple Juice|🍎|#e3a82b|0
Grape Juice|🍇|#5b1f6e|0
Cranberry Juice|🫐|#a3122f|0
Pineapple Juice|🍍|#f5d24a|0
Tomato Juice|🍅|#c8301d|0
Watermelon Juice|🍉|#ff5d73|0
Lemonade|🍋|#fff08a|0
Pink Lemonade|🍋|#ff9fb5|0
Limeade|🍈|#b8e04a|0
Iced Tea|🧊|#9a5a1b|0
Sweet Tea|🍯|#b8741f|0
Peach Iced Tea|🍑|#e89a4f|0
Arnold Palmer|🍋|#d9a83a|0
Green Tea|🍵|#a8c44a|0
Matcha Latte|🍵|#8fbf5a|0
Chai Latte|☕|#c08d5a|0
Black Coffee|☕|#25140b|0
Latte|☕|#b98a5e|0
Cappuccino|☕|#a47148|0
Mocha|☕|#6b3d22|0
Iced Coffee|🧊|#5a3520|0
Cold Brew|🧊|#2e1a0e|0
Hot Chocolate|🍫|#4b2815|0
Milk|🥛|#fdfdf5|0
Chocolate Milk|🍫|#7a4a2c|0
Strawberry Milk|🍓|#ffb3c7|0
Oat Milk|🌾|#efe2c4|0
Almond Milk|🌰|#f3ead8|0
Horchata|🥛|#f2e6cf|0
Coconut Water|🥥|#f1f0e4|0
Strawberry Smoothie|🍓|#ff6f91|0
Mango Smoothie|🥭|#ffb627|0
Blueberry Smoothie|🫐|#6a5acd|0
Green Smoothie|🥬|#6fbf4a|0
Banana Smoothie|🍌|#f6e27a|0
Vanilla Shake|🍦|#fff1cf|0
Chocolate Shake|🍫|#6a3b25|0
Strawberry Shake|🍓|#ff9cb8|0
Boba Milk Tea|🧋|#c9a27a|0
Taro Bubble Tea|🧋|#b79ae0|0
Kombucha|🫖|#d9922e|1
Blue Sports Drink|⚡|#2aa8ff|0
Energy Drink|⚡|#d6ff3a|1
Shirley Temple|🍒|#ff5a6e|1
Virgin Mojito|🌿|#cdeea0|1
Virgin Piña Colada|🍍|#fff4c2|0
Hibiscus Agua Fresca|🌺|#c2185b|0`.split('\n').map(l=>{const p=l.split('|');return{n:p[0],e:p[1],c:p[2],f:+p[3]}});

const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const dpr=window.devicePixelRatio||1;cv.width=320*dpr;cv.height=400*dpr;cv.style.width='320px';cv.style.height='auto';ctx.scale(dpr,dpr);
let cur=0,lvl=1,ang=0,hold=false,glasses=0,sips=0,last=performance.now(),bub=[];
for(let i=0;i<26;i++)bub.push({x:Math.random()*110-55,y:Math.random()*230,s:12+Math.random()*25,r:1.5+Math.random()*2.5});

function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=a<0?0:255,t=Math.abs(a);return`rgb(${Math.round(r+(m-r)*t)},${Math.round(g+(m-g)*t)},${Math.round(b+(m-b)*t)})`}
function glassPath(){ctx.beginPath();ctx.moveTo(-78,-115);ctx.lineTo(78,-115);ctx.lineTo(58,115);ctx.quadraticCurveTo(0,128,-58,115);ctx.closePath()}

function draw(dt){
  ctx.clearRect(0,0,320,400);
  const d=D[cur];
  ctx.save();ctx.translate(160,230);ctx.rotate(-ang);
  glassPath();ctx.fillStyle='rgba(180,200,255,.12)';ctx.fill();
  ctx.save();glassPath();ctx.clip();
  if(lvl>0){
    const ys=115-lvl*230;
    ctx.save();ctx.translate(0,ys);ctx.rotate(ang);
    const g=ctx.createLinearGradient(0,0,0,260);g.addColorStop(0,shade(d.c,.1));g.addColorStop(1,shade(d.c,-.25));
    ctx.fillStyle=g;ctx.fillRect(-400,0,800,600);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-400,0,800,2.5);
    if(d.f){ctx.fillStyle='rgba(255,255,255,.55)';
      for(const b of bub){b.y-=b.s*dt;if(b.y<0)b.y=lvl*230;if(b.y<=lvl*230){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}}}
    ctx.restore();
  }
  ctx.restore();
  glassPath();ctx.lineWidth=4;ctx.strokeStyle='rgba(220,235,255,.75)';ctx.stroke();
  ctx.beginPath();ctx.moveTo(-62,-95);ctx.lineTo(-47,95);ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineCap='round';ctx.stroke();
  ctx.restore();
}

function setDrink(i){cur=i;lvl=1;ang=0;const d=D[i];document.getElementById('name').textContent=d.e+' '+d.n;
  document.querySelectorAll('.chip').forEach((c,k)=>c.classList.toggle('on',+c.dataset.i===i));
  document.getElementById('hint').textContent='Hold the glass (or press Space) to drink'}
function stats(){document.getElementById('stats').textContent='Sips: '+sips+' · Glasses finished: '+glasses}

function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  const target=hold&&lvl>0?0.95:0;
  ang+=(target-ang)*Math.min(1,dt*8);
  if(hold&&lvl>0&&ang>.4){
    lvl=Math.max(0,lvl-dt*.07);
    if(Math.random()<dt*2.2)sips++;
    if(lvl===0){glasses++;document.getElementById('hint').textContent='Empty! Tap Refill or pick another drink.'}
    stats();
  }
  draw(dt);requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown',e=>{hold=true;cv.setPointerCapture(e.pointerId)});
['pointerup','pointercancel','blur'].forEach(ev=>window.addEventListener(ev,()=>hold=false));
document.addEventListener('visibilitychange',()=>{if(document.hidden)hold=false});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();hold=true}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){hold=false;if(e.target.tagName!=='INPUT')e.preventDefault()}});
document.getElementById('refill').onclick=()=>setDrink(cur);

const grid=document.getElementById('grid');
D.forEach((d,i)=>{const b=document.createElement('button');b.className='chip';b.dataset.i=i;b.dataset.n=d.n.toLowerCase();
  b.innerHTML='<i style="background:'+d.c+'"></i><span>'+d.e+' '+d.n+'</span>';b.onclick=()=>setDrink(i);grid.appendChild(b)});
document.getElementById('q').oninput=e=>{const v=e.target.value.toLowerCase();grid.querySelectorAll('.chip').forEach(c=>c.style.display=c.dataset.n.includes(v)?'':'none')};

/* ---- Tilt mode: drink fills the whole screen, phone tilt controls it ---- */
const $=id=>document.getElementById(id);
const ov=$('ov'),tc=$('tc'),tx=tc.getContext('2d');
const iOS=typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';
const TAU=Math.PI*2,wrap=a=>a-TAU*Math.round(a/TAU);
let tOn=false,tl=1,th=0,tv=0,tt=0,hasSensor=false,dragTh=null,flip=1,tlast=0,tdone=false,mT=0,loopId=0,lock=null,gx=0,gy=9.8;
const tb=[];for(let i=0;i<40;i++)tb.push({x:Math.random(),y:Math.random(),s:.05+Math.random()*.1,r:2+Math.random()*3});
function tsize(){const r=window.devicePixelRatio||1;tc.width=Math.round(innerWidth*r);tc.height=Math.round(innerHeight*r);tx.setTransform(r,0,0,r,0,0)}
function tmsg(s,keep){const m=$('omsg');m.textContent=s;m.style.display=s?'block':'none';clearTimeout(mT);if(s&&!keep)mT=setTimeout(()=>m.style.display='none',3500)}
function updTName(){const d=D[cur];$('oname').textContent=d.e+' '+d.n}
async function wl(on){try{if(on&&navigator.wakeLock)lock=await navigator.wakeLock.request('screen');else if(lock){await lock.release();lock=null}}catch(e){}}
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null||a.y==null)return;
  const s=iOS?-1:1;
  gx+=(s*a.x-gx)*.35;gy+=(s*a.y-gy)*.35;      // low-pass filter to calm sensor noise
  if(Math.hypot(gx,gy)<2.5)return;             // phone lying flat: keep last angle
  hasSensor=true;
  const ra=((screen.orientation&&screen.orientation.angle)||0)*Math.PI/180; // landscape support
  tt=flip*wrap(Math.atan2(-gx,gy)+ra);
}
async function openTilt(){
  if(tOn)return;
  tOn=true;ov.style.display='block';tsize();
  try{ov.requestFullscreen&&ov.requestFullscreen().catch(()=>{})}catch(e){}
  tl=1;th=0;tv=0;tt=0;gx=0;gy=9.8;hasSensor=false;tdone=false;dragTh=null;
  updTName();
  let ok=true;
  try{if(iOS)ok=(await DeviceMotionEvent.requestPermission())==='granted'}catch(e){ok=false}
  if(!tOn)return;                               // closed while the permission prompt was open
  if(ok){window.addEventListener('devicemotion',onMotion);tmsg('Tilt your phone sideways to drink')}
  else tmsg('Motion access was blocked \u2013 drag left or right to tilt instead',true);
  setTimeout(()=>{if(tOn&&ok&&!hasSensor)tmsg('No tilt sensor found \u2013 drag left or right on the screen to tilt')},1800);
  wl(true);
  const id=++loopId;tlast=performance.now();requestAnimationFrame(t=>tloop(t,id));
}
function closeTilt(){
  tOn=false;loopId++;ov.style.display='none';
  window.removeEventListener('devicemotion',onMotion);wl(false);
  try{document.fullscreenElement&&document.exitFullscreen().catch(()=>{})}catch(e){}
}
function tloop(t,id){
  if(!tOn||id!==loopId)return;
  const dt=Math.min((t-tlast)/1000,.05);tlast=t;
  const target=(!hasSensor&&dragTh!=null)?dragTh:tt;
  tv+=(wrap(target-th)*60-tv*8)*dt;th=wrap(th+tv*dt);   // springy slosh, shortest-way rotation
  if(Math.abs(wrap(target))>.6&&tl>0){
    tl=Math.max(0,tl-dt*.08);if(Math.random()<dt*2.2){sips++;stats()}
    if(tl===0&&!tdone){tdone=true;glasses++;stats();tmsg('Empty! Hit Refill or pick another drink',true)}
  }
  $('pct').textContent=Math.round(tl*100)+'%';
  tdraw(dt);requestAnimationFrame(t2=>tloop(t2,id));
}
function tdraw(dt){
  const w=innerWidth,h=innerHeight,d=D[cur],dg=Math.hypot(w,h);
  tx.clearRect(0,0,w,h);if(tl<=0)return;
  tx.save();tx.translate(w/2,h/2);tx.rotate(-th);
  const ys=dg*(.5-tl),amp=Math.min(30,6+Math.abs(tv)*10),now=performance.now();
  tx.beginPath();tx.moveTo(-dg,dg);tx.lineTo(-dg,ys);
  for(let x=-dg;x<=dg;x+=20)tx.lineTo(x,ys+Math.sin(x/60+now/400)*amp*.5);
  tx.lineTo(dg,ys);tx.lineTo(dg,dg);tx.closePath();
  const g=tx.createLinearGradient(0,ys,0,ys+dg);g.addColorStop(0,shade(d.c,.1));g.addColorStop(1,shade(d.c,-.3));
  tx.fillStyle=g;tx.fill();
  if(d.f){tx.fillStyle='rgba(255,255,255,.45)';for(const b of tb){b.y-=b.s*dt;if(b.y<0)b.y=1;tx.beginPath();tx.arc((b.x-.5)*dg,ys+b.y*dg*tl,b.r,0,7);tx.fill()}}
  tx.restore();
}
tc.addEventListener('pointermove',e=>{if(e.buttons)dragTh=Math.max(-1.2,Math.min(1.2,(e.clientX-innerWidth/2)/(innerWidth/2)*1.2))});
['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,()=>dragTh=null));
window.addEventListener('resize',()=>{if(tOn)tsize()});
document.addEventListener('visibilitychange',()=>{if(tOn&&!document.hidden)wl(true)});
$('tiltbtn').onclick=openTilt;$('oclose').onclick=closeTilt;
$('orefill').onclick=()=>{tl=1;tdone=false;tmsg('')};
$('oflip').onclick=()=>{flip*=-1;tt*=-1;tmsg('Direction flipped')};
const step=k=>{setDrink((cur+k+D.length)%D.length);tl=1;tdone=false;tmsg('');updTName()};
$('oprev').onclick=()=>step(-1);$('onext').onclick=()=>step(1);

setDrink(0);stats();requestAnimationFrame(loop);
</script>
</body>
</html>
